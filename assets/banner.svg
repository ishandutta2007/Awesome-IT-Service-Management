<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.15)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-7px) scale(1.03); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes orbitRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-node-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-node-2 { animation: floatFast 5s ease-in-out infinite 1s; }
      .floating-node-3 { animation: floatSlow 8s ease-in-out infinite 2s; }
      .pulsing-orb { transform-origin: center; animation: pulseGlow 4s ease-in-out infinite; }
      .rotating-group { transform-origin: 1040px 190px; animation: orbitRotate 24s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />
  <rect width="1200" height="380" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <circle class="pulsing-orb" cx="150" cy="100" r="120" fill="rgba(56, 189, 248, 0.08)" filter="url(#glowPulse)" />
  <circle class="pulsing-orb" cx="1040" cy="190" r="140" fill="rgba(147, 51, 234, 0.12)" filter="url(#glowPulse)" />
  <circle class="pulsing-orb" cx="600" cy="300" r="100" fill="rgba(244, 114, 182, 0.06)" filter="url(#glowPulse)" />

  <g stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 80 190 Q 250 80 450 140 T 800 130" />
    <path d="M 150 290 Q 380 340 620 280 T 1000 240" />
  </g>

  <g class="floating-node-1">
    <rect x="80" y="70" width="46" height="46" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
    <path d="M93 85 h20 v16 h-20 z M98 90 h10 M98 94 h6" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>

  <g class="floating-node-2">
    <rect x="130" y="240" width="48" height="48" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)" />
    <path d="M154 252 l10 4 v10 c0 7 -10 12 -10 12 s-10 -5 -10 -12 v-10 z" stroke="#818cf8" stroke-width="1.8" fill="none" stroke-linejoin="round" />
  </g>

  <g class="floating-node-3">
    <rect x="520" y="45" width="42" height="42" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow)" />
    <path d="M531 58 c0 -2 5 -4 10 -4 s10 2 10 4 v14 c0 2 -5 4 -10 4 s-10 -2 -10 -4 z M531 64 c0 2 5 4 10 4 s10 -2 10 -4 M531 70 c0 2 5 4 10 4 s10 -2 10 -4" stroke="#c084fc" stroke-width="1.5" fill="none" />
  </g>

  <g class="rotating-group">
    <circle cx="1040" cy="190" r="100" fill="none" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1.5" stroke-dasharray="8,6" />
    <circle cx="1040" cy="190" r="60" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.2" />

    <g transform="translate(1040, 90)">
      <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="4" fill="#38bdf8" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">INC</text>
    </g>
    <g transform="translate(1140, 190)">
      <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      <text x="0" y="4" fill="#818cf8" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">PRB</text>
    </g>
    <g transform="translate(1040, 290)">
      <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#c084fc" stroke-width="2" />
      <text x="0" y="4" fill="#c084fc" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">CHG</text>
    </g>
    <g transform="translate(940, 190)">
      <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#f472b6" stroke-width="2" />
      <text x="0" y="4" fill="#f472b6" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">REQ</text>
    </g>
  </g>

  <circle cx="1040" cy="190" r="32" fill="url(#accentGrad)" opacity="0.9" filter="url(#glow)" />
  <text x="1040" y="195" fill="#ffffff" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">ITSM</text>

  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="300" height="32" rx="16" fill="url(#badgeGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="20.5" fill="#bae6fd" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM • 2026</text>
  </g>

  <text x="80" y="130" fill="url(#textGrad)" font-size="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
    Awesome IT Service Management
  </text>

  <text x="80" y="172" fill="#94a3b8" font-size="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500">
    Enterprise SaaS Platforms &amp; Production-Ready Open-Source ITSM Solutions
  </text>

  <g transform="translate(80, 215)">
    <rect x="0" y="0" width="160" height="34" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="14" y="21.5" fill="#e2e8f0" font-size="12.5" font-family="system-ui, -apple-system, sans-serif" font-weight="600">⚡ Incident &amp; Problem</text>

    <rect x="172" y="0" width="150" height="34" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
    <text x="186" y="21.5" fill="#e2e8f0" font-size="12.5" font-family="system-ui, -apple-system, sans-serif" font-weight="600">🔄 Change &amp; Release</text>

    <rect x="334" y="0" width="135" height="34" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
    <text x="348" y="21.5" fill="#e2e8f0" font-size="12.5" font-family="system-ui, -apple-system, sans-serif" font-weight="600">🗄️ CMDB &amp; Assets</text>

    <rect x="481" y="0" width="125" height="34" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1" />
    <text x="495" y="21.5" fill="#e2e8f0" font-size="12.5" font-family="system-ui, -apple-system, sans-serif" font-weight="600">🤖 ITIL 4 &amp; AI</text>
  </g>

  <g transform="translate(80, 280)">
    <g>
      <text x="0" y="28" fill="#38bdf8" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800">10+</text>
      <text x="65" y="18" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="700">TOP SAAS</text>
      <text x="65" y="31" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">LEADERS</text>
    </g>

    <g transform="translate(180, 0)">
      <text x="0" y="28" fill="#818cf8" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800">15+</text>
      <text x="60" y="18" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="700">OPEN-SOURCE</text>
      <text x="60" y="31" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">REPOSITORIES</text>
    </g>

    <g transform="translate(360, 0)">
      <text x="0" y="28" fill="#c084fc" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800">100%</text>
      <text x="75" y="18" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="700">COMMUNITY</text>
      <text x="75" y="31" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">CURATED</text>
    </g>
  </g>
</svg>